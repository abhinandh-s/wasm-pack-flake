name: Auto Update
on:
  push:
  workflow_dispatch: 

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate new sources.nix
        uses: abhinandh-s/nix-update-action@v1
        with:
          owner: 'drager'
          repo: 'wasm-pack'
          
      - name: Commit if changed
        run: |
          ls 
          cat sources.nix
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources.nix
          git commit -m "chore: update sources.nix" || exit 0
          git push
